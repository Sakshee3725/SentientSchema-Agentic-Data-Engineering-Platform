server:
  port: ${PORT:8080}
  forward-headers-strategy: native

spring:
  application:
    name: agentic-schema-evolution-platform
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dataeng_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: agentic-dataeng-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      auto-startup: ${SPRING_KAFKA_LISTENER_AUTO_STARTUP:true}
    admin:
      auto-create: false

pipeline:
  kafka:
    topics: events.ecommerce_orders,events.fintech_cdc,events.iot_telemetry,events.healthcare_ehr

langchain4j:
  google-ai-gemini:
    chat-model:
      api-key: ${GEMINI_API_KEY:MY_GEMINI_API_KEY}
      model-name: gemini-2.0-flash
      temperature: 0.1
      log-requests: true
      log-responses: true

logging:
  level:
    com.agentic.dataeng: INFO
    org.springframework.kafka: WARN
